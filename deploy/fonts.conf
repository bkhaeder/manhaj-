<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- خطوط Windows غير متوفرة على Linux: نستبدلها بخطوط مكافئة عند تحويل PDF -->
<fontconfig>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
</fontconfig>
