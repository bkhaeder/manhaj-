<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}منصة منهج{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a href="{{ url_for('index') }}" class="brand"><span class="mark">م</span> منصة منهج</a>
  </header>
  <main class="wrap {% block wrapclass %}{% endblock %}">
    {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">منصة منهج © — بحوث أكاديمية منظمة وفق المنهج العلمي</footer>
</body>
</html>
